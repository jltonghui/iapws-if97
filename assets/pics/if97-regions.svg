<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title description">
  <title id="title">IAPWS-IF97 pressure–temperature operating envelope</title>
  <desc id="description">The formulation's regions on linear temperature and logarithmic pressure axes. Region 1 is liquid, Region 2 steam, Region 3 dense fluid, Region 4 the saturation curve, and Region 5 high-temperature steam. The domain extends from 273.15 to 2273.15 K; the pressure ceiling is 100 MPa through 1073.15 K and 50 MPa above it. The plotted lower pressure limit is 0.000611212677444 MPa.</desc>
  <!-- Data: current src compiled with tsc to /tmp. Geometry uses exported constants, saturationPressure (165 samples, 273.15 K to Tc) and boundary23_T_to_P (97 samples, 623.15 to 863.15 K). Straight segments join samples; the rounded B23 endpoint is clipped to P_MAX=100 MPa. Region 4 is the mathematical boundary, including the 0.01 K interval below the triple point; this diagram does not assert exact-critical state-solver support. Coordinates: linear T; natural-log pressure, P_MIN to P_MAX. -->
  <rect width="1120" height="500" rx="12" fill="#faf9f5"/>
